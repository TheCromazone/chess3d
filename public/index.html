<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14100d">
<title>Chess 3D</title>
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/favicon.png">
<meta property="og:title" content="Chess 3D">
<meta property="og:description" content="Full chess on a 3D board — play online with a friend, vs the computer, or pass & play. Phones and computers.">
<meta property="og:image" content="https://chess3d-five.vercel.app/assets/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #14100d; color: #e8e0d2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }

  #scene-wrap { position: fixed; inset: 0; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top-bar { justify-content: flex-start; }
  #bottom-bar { justify-content: flex-start; margin-top: auto; }
  .plate { display: flex; align-items: center; gap: 8px; background: rgba(22,17,13,.78);
    border: 1px solid rgba(233,220,195,.12); border-radius: 12px; padding: 7px 12px; backdrop-filter: blur(6px); }
  .pname { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .cdot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.5); }
  .cw { background: #e9dcc3; } .cb { background: #35281f; }
  .captured { font-size: 15px; letter-spacing: 1px; min-height: 1em; }
  .captured .gw { color: #e9dcc3; text-shadow: 0 0 2px #000; }
  .captured .gb { color: #4a3a2e; text-shadow: 0 0 2px #000; }
  .captured .lead { color: #9fd6ae; font-size: 12px; font-weight: 700; margin-left: 4px; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px;
    background: rgba(22,17,13,.78); border: 1px solid rgba(233,220,195,.12);
    border-radius: 10px; padding: 7px 12px; min-width: 76px; text-align: center; backdrop-filter: blur(6px); }
  .clock.active { border-color: #34d27b; box-shadow: 0 0 10px rgba(52,210,123,.35); }
  .clock.low { color: #ff8a7a; }
  #status { position: fixed; left: 50%; transform: translateX(-50%); top: max(10px, env(safe-area-inset-top));
    background: rgba(22,17,13,.72); border-radius: 999px; padding: 6px 16px; font-size: 13px;
    color: #cdbfa6; pointer-events: none; white-space: nowrap; z-index: 3; }

  /* ---------- side panel ---------- */
  #panel { position: fixed; right: 12px; top: 64px; bottom: 64px; width: 260px;
    display: flex; flex-direction: column; gap: 8px; background: rgba(22,17,13,.82);
    border: 1px solid rgba(233,220,195,.12); border-radius: 14px; padding: 12px;
    backdrop-filter: blur(8px); z-index: 2; }
  #lbl-moves { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #9c8d74; }
  #moves { flex: 1; overflow-y: auto; font-size: 14px; line-height: 1.9; align-content: start; }
  #moves .mvnum { color: #8b7c63; margin-right: 5px; }
  #moves .mv { margin-right: 10px; font-weight: 600; }
  #toolbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #toolbar button { background: rgba(233,220,195,.08); border: 1px solid rgba(233,220,195,.14);
    border-radius: 10px; padding: 9px 4px; font-size: 12px; min-height: 44px; }
  #toolbar button:active { background: rgba(233,220,195,.2); }

  /* ---------- menu ---------- */
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(rgba(12,8,5,.68), rgba(10,7,4,.84)),
      url("./assets/menu-bg.jpg") center / cover no-repeat,
      radial-gradient(ellipse at 50% 30%, #241a12 0%, #14100d 65%, #0b0806 100%); }
  .menu-card { display: flex; flex-direction: column; gap: 14px; align-items: stretch;
    width: min(400px, calc(100vw - 40px)); max-height: calc(100vh - 40px); overflow-y: auto; padding: 10px; }
  #menu-title { font-family: Georgia, "Times New Roman", serif; font-size: 44px; text-align: center;
    color: #e9dcc3; letter-spacing: 2px; text-shadow: 0 2px 24px rgba(232,195,90,.25); }
  #menu-sub { text-align: center; color: #9c8d74; font-size: 14px; margin-bottom: 12px; }
  .mode-btn { background: linear-gradient(180deg, rgba(233,220,195,.10), rgba(233,220,195,.05));
    border: 1px solid rgba(233,220,195,.18); border-radius: 14px; padding: 16px; font-size: 17px;
    font-weight: 600; min-height: 56px; }
  .mode-btn:active { background: rgba(233,220,195,.22); }
  #menu-options { flex-direction: column; gap: 14px; }
  .opt-row { display: flex; flex-direction: column; gap: 7px; }
  .opt-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #9c8d74; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; background: rgba(233,220,195,.06); border: 1px solid rgba(233,220,195,.14);
    border-radius: 10px; padding: 10px 8px; font-size: 13px; min-height: 44px; white-space: nowrap; }
  .seg button.on { background: rgba(52,210,123,.18); border-color: #34d27b; color: #bdf0d2; }
  #online-hint { color: #9c8d74; font-size: 13px; text-align: center; }
  .menu-actions { display: flex; gap: 10px; margin-top: 6px; }
  #opt-back { flex: 1; border: 1px solid rgba(233,220,195,.16); border-radius: 12px; padding: 13px; min-height: 48px; }
  #opt-start { flex: 2; background: linear-gradient(180deg, #3fca7f, #2ba15f); color: #06130b;
    font-weight: 700; border-radius: 12px; padding: 13px; font-size: 16px; min-height: 48px; }

  /* ---------- modal ---------- */
  #modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(8,6,4,.65); backdrop-filter: blur(3px); }
  #modal-card { background: #201812; border: 1px solid rgba(233,220,195,.18); border-radius: 16px;
    padding: 22px; width: min(340px, calc(100vw - 48px)); text-align: center;
    box-shadow: 0 12px 60px rgba(0,0,0,.6); }
  #modal-card h2 { font-family: Georgia, serif; font-size: 28px; color: #e9dcc3; margin-bottom: 4px; }
  #modal-card h3 { font-size: 17px; color: #e9dcc3; margin-bottom: 14px; }
  #modal-card .sub { color: #9c8d74; font-size: 14px; margin-bottom: 16px; }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
  .btn-row button { flex: 1; border: 1px solid rgba(233,220,195,.18); border-radius: 10px;
    padding: 12px; min-height: 46px; font-weight: 600; }
  .btn-row .primary { background: linear-gradient(180deg, #3fca7f, #2ba15f); color: #06130b; border: none; }
  .btn-row .danger { background: rgba(224,85,72,.2); border-color: #e05548; color: #ffb3a8; }
  .promo-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .promo { font-size: 34px; line-height: 1.1; background: rgba(233,220,195,.07);
    border: 1px solid rgba(233,220,195,.16); border-radius: 12px; padding: 10px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .promo small { font-size: 10px; color: #9c8d74; }
  .tc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tc { background: rgba(233,220,195,.07); border: 1px solid rgba(233,220,195,.16);
    border-radius: 10px; padding: 13px 6px; min-height: 48px; font-weight: 600; }

  /* ---------- invite banner / toast ---------- */
  #invite { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(76px, calc(env(safe-area-inset-bottom) + 76px));
    display: none; flex-direction: column; gap: 8px; background: rgba(22,17,13,.92);
    border: 1px solid rgba(52,210,123,.4); border-radius: 14px; padding: 14px;
    width: min(420px, calc(100vw - 32px)); z-index: 5; }
  #invite-label { font-size: 13px; color: #bdf0d2; }
  .invite-row { display: flex; gap: 8px; }
  #invite-link { flex: 1; background: rgba(0,0,0,.35); border: 1px solid rgba(233,220,195,.14);
    border-radius: 8px; color: #e8e0d2; padding: 9px 10px; font-size: 12px; min-width: 0; }
  #invite-copy { background: rgba(52,210,123,.2); border: 1px solid #34d27b; color: #bdf0d2;
    border-radius: 8px; padding: 9px 14px; font-weight: 600; white-space: nowrap; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom));
    background: rgba(32,24,18,.95); border: 1px solid rgba(233,220,195,.2); border-radius: 999px;
    padding: 9px 18px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; }

  /* ---------- phone layout ---------- */
  @media (max-width: 899px) {
    #panel { left: 8px; right: 8px; top: auto; bottom: 0; width: auto; border-radius: 14px 14px 0 0;
      padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); gap: 6px; }
    #lbl-moves { display: none; }
    #moves { flex: none; display: flex; overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      line-height: 1.4; padding: 2px 0; scrollbar-width: none; }
    #moves::-webkit-scrollbar { display: none; }
    #toolbar { grid-template-columns: repeat(6, 1fr); }
    #toolbar button { font-size: 11px; padding: 7px 2px; }
    #top-bar { padding-top: max(44px, env(safe-area-inset-top)); }
    #bottom-bar { margin-bottom: 106px; }
    .pname { font-size: 12px; } .clock { font-size: 15px; min-width: 64px; padding: 6px 9px; }
    #invite { bottom: 150px; }
  }
</style>
</head>
<body>
<div id="scene-wrap"><canvas id="scene"></canvas></div>

<div id="status"></div>

<div id="hud" style="display:none">
  <div id="top-bar" class="bar">
    <div class="plate"><span id="top-dot" class="cdot cb"></span><span id="top-name" class="pname"></span>
      <span id="top-captured" class="captured"></span></div>
    <div id="top-clock" class="clock" style="margin-left:auto"></div>
  </div>
  <div id="bottom-bar" class="bar">
    <div class="plate"><span id="bottom-dot" class="cdot cw"></span><span id="bottom-name" class="pname"></span>
      <span id="bottom-captured" class="captured"></span></div>
    <div id="bottom-clock" class="clock" style="margin-left:auto"></div>
  </div>
  <div id="panel">
    <div id="lbl-moves"></div>
    <div id="moves"></div>
    <div id="toolbar">
      <button id="btn-new">🏠</button>
      <button id="btn-flip">🔄</button>
      <button id="btn-undo">↩️</button>
      <button id="btn-draw">½</button>
      <button id="btn-resign">🏳️</button>
      <button id="btn-sound">🔊</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="menu-card">
    <div id="menu-title"></div>
    <div id="menu-sub"></div>
    <div id="menu-main" style="display:flex;flex-direction:column;gap:12px">
      <button id="mode-ai" class="mode-btn"></button>
      <button id="mode-local" class="mode-btn"></button>
      <button id="mode-online" class="mode-btn"></button>
    </div>
    <div id="menu-options" style="display:none">
      <div class="opt-row" id="opt-side-row">
        <div class="opt-label" id="opt-side-label"></div>
        <div class="seg" id="seg-side">
          <button data-v="w" class="on"></button><button data-v="b"></button><button data-v="random"></button>
        </div>
      </div>
      <div class="opt-row" id="opt-level-row">
        <div class="opt-label" id="opt-level-label"></div>
        <div class="seg" id="seg-level">
          <button data-v="1"></button><button data-v="2" class="on"></button><button data-v="3"></button><button data-v="4"></button>
        </div>
      </div>
      <div class="opt-row" id="opt-time-row">
        <div class="opt-label" id="opt-time-label"></div>
        <div class="seg" id="seg-time">
          <button data-v="1+0"></button><button data-v="3+2"></button><button data-v="5+0"></button>
          <button data-v="10+0" class="on"></button><button data-v="15+10"></button><button data-v="inf"></button>
        </div>
      </div>
      <div id="online-hint" style="display:none"></div>
      <div class="menu-actions">
        <button id="opt-back"></button>
        <button id="opt-start"></button>
      </div>
    </div>
  </div>
</div>

<div id="modal"><div id="modal-card"></div></div>

<div id="invite">
  <div id="invite-label"></div>
  <div class="invite-row"><input id="invite-link" readonly><button id="invite-copy"></button></div>
</div>

<div id="toast"></div>

<script src="./game.js" defer></script>
</body>
</html>
