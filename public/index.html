<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110d">
<title>Chess 3D</title>
<meta name="description" content="Play chess on a real 3D board: online, against bots from 250 to 3200, puzzles, Puzzle Rush, lessons, and Stockfish game review. Free, in your browser.">
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Chess 3D">
<meta property="og:description" content="Play chess on a real 3D board: online, against bots, puzzles, lessons, and Stockfish game review.">
<meta property="og:image" content="https://chess3d-five.vercel.app/assets/cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Main"></nav>
  <main id="main">
    <section id="arena" aria-label="Board">
      <div class="strip" id="strip-top"></div>
      <div id="stage-wrap">
        <div id="evalbar" class="evalbar" hidden><div class="evalbar-fill"></div><span class="evalbar-num"></span></div>
        <div id="stage">
          <div id="host3d" class="board-host"></div>
          <div id="host2d" class="board-host" hidden></div>
          <div id="stage-overlay"></div>
        </div>
      </div>
      <div class="strip" id="strip-bottom"></div>
    </section>
    <aside id="side" aria-label="Panel"></aside>
    <section id="page" hidden></section>
  </main>
  <nav id="tabbar" aria-label="Main"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript>Chess 3D needs JavaScript to run.</noscript>
<script src="./game.js" defer></script>
</body>
</html>
