<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board2D sandbox</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#16100c; --panel:#221812; --line:#3a2b20; --text:#e9dcc3; --muted:#a8957a; --accent:#34d27b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  #stage { flex: none; }
  #wrap { width: 560px; height: 560px; resize: both; overflow: hidden; min-width: 160px; min-height: 160px;
    background: repeating-linear-gradient(45deg, #1d1510 0 10px, #1a130e 10px 20px); border: 1px dashed #3a2b20; }
  #size { color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  #panel { flex: 1; min-width: 0; max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
  .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .sec h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 6px; border: 1px solid var(--line);
    background: #2b2018; color: var(--text); cursor: pointer; font: inherit; }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .sw { width: 22px; height: 22px; border-radius: 4px; background-size: cover; background-position: center; }
  .pc { width: 26px; height: 26px; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button.b { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #2b2018; color: var(--text); font: inherit; cursor: pointer; }
  button.b:hover, .chip:hover { border-color: #5a4430; }
  button.b.on { background: #1f3a2b; border-color: var(--accent); }
  label { display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { accent-color: var(--accent); }
  #log { height: 140px; overflow: auto; font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; }
  #status { color: var(--text); font-weight: 600; }
  body.bare #panel, body.bare #size { display: none; }
  body.bare #app { padding: 0; }
  body.bare #wrap { width: 100vw; height: 100vh; resize: none; border: 0; background: var(--bg); }
  body.gallery #app { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding: 18px; }
  body.gallery figure { margin: 0; }
  body.gallery .gbox { width: 100%; aspect-ratio: 1; }
  body.gallery figcaption { margin-top: 6px; color: var(--muted); }
  @media (max-width: 760px) {
    #app { flex-direction: column; padding: 8px 0; gap: 10px; }
    #stage { width: 100%; }
    #wrap { width: 100vw; height: 100vw; resize: none; border: 0; }
    #size { padding: 0 16px; }
    #panel { max-width: none; width: 100%; padding: 0 16px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="wrap"></div>
    <div id="size"></div>
  </div>
  <div id="panel">
    <div class="sec"><h3>Status</h3><div id="status">-</div></div>
    <div class="sec"><h3>Board theme</h3><div class="chips" id="boardThemes"></div></div>
    <div class="sec"><h3>Pieces</h3><div class="chips" id="pieceThemes"></div></div>
    <div class="sec"><h3>Display</h3>
      <div class="row">
        <label><input type="checkbox" id="coords" checked> Coordinates</label>
        <label>animMs <input type="range" id="anim" min="0" max="800" step="10" value="220"> <span id="animV">220</span></label>
        <label><input type="checkbox" id="active" checked> Active</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="b" id="flip">Flip</button>
        <button class="b" id="flipInstant">Flip (instant)</button>
        <button class="b" id="recreate">Destroy + recreate</button>
      </div>
    </div>
    <div class="sec"><h3>Demos</h3>
      <div class="row">
        <button class="b" id="arrows">Arrows</button>
        <button class="b" id="marks">Marks</button>
        <button class="b" id="premove">Premove</button>
        <button class="b" id="check">Check position</button>
        <button class="b" id="hints">Legal hints (e2/Nb1)</button>
        <button class="b" id="userdraw">User drawings</button>
        <button class="b" id="clearDemo">Clear overlays</button>
      </div>
    </div>
    <div class="sec"><h3>Test sequences</h3>
      <div class="row">
        <button class="b" id="seqCastle">Castling (O-O / O-O-O)</button>
        <button class="b" id="seqEp">En passant (both sides)</button>
        <button class="b" id="seqPromo">Promotion (+capture, underpromo)</button>
        <button class="b" id="autoplay">Random autoplay</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="b" id="reset">Reset</button>
        <button class="b" id="undo">Undo</button>
        <button class="b" id="resync">syncFromBoard</button>
      </div>
    </div>
    <div class="sec"><h3>Callback log</h3><div id="log"></div></div>
  </div>
</div>
<script src="./main.js"></script>
</body>
</html>
